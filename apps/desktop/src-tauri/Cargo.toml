[package]
name = "betterkeepass-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "GPL-3.0-or-later"
description = "Aplicativo desktop Tauri v2 do BetterKeePass"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
bkp-core = { path = "../../../crates/bkp-core" }
bkp-passkey = { path = "../../../crates/bkp-passkey" }
bkp-platform = { path = "../../../crates/bkp-platform" }
bkp-protocol = { path = "../../../crates/bkp-protocol" }
chacha20poly1305 = "0.10"
getrandom = { version = "0.4", features = ["std"] }
rust-argon2 = "3.0"
secrecy = "0.10.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2.7.3"
ureq = { version = "3", default-features = false, features = ["rustls"] }
uuid = { version = "1.18", features = ["v4", "serde"] }
zeroize = "1"

[lints.rust]
unsafe_code = "forbid"

# Mantém o binário desktop rápido para recompilar, mas otimiza Argon2/KDF/crypto das dependências.
[profile.dev.package."*"]
opt-level = 3
