[workspace]
resolver = "3"
members = [
    "crates/bkp-core",
    "crates/bkp-cli",
    "crates/bkp-passkey",
    "crates/bkp-protocol",
    "crates/bkp-platform",
    "crates/bkp-proxy",
]
exclude = ["fuzz", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "GPL-3.0-or-later"
repository = "https://github.com/betterkeepass/BetterKeePass"
authors = ["BetterKeePass Contributors"]

[workspace.dependencies]
anyhow = "1"
arboard = "3"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
ciborium = "0.2"
clap = { version = "4", features = ["derive"] }
coset = "0.4"
csv = "1.4"
ed25519-dalek = { version = "2", features = ["rand_core", "pkcs8"] }
getrandom = { version = "0.4", features = ["std"] }
keepass = { version = "0.17", features = ["save_kdbx4", "totp"] }
p256 = { version = "0.13", features = ["ecdsa", "pkcs8", "pem"] }
pkcs8 = { version = "0.10", features = ["pem"] }
rand_core = { version = "0.6", features = ["getrandom"] }
rpassword = "7"
secrecy = "0.10.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
snow = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
uuid = { version = "1.18", features = ["v4", "serde"] }
zeroize = { version = "1", features = ["zeroize_derive"] }
zxcvbn = "3.1"

bkp-core = { path = "crates/bkp-core", version = "0.1.0" }
bkp-passkey = { path = "crates/bkp-passkey", version = "0.1.0" }
bkp-platform = { path = "crates/bkp-platform", version = "0.1.0" }
bkp-protocol = { path = "crates/bkp-protocol", version = "0.1.0" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
doc_markdown = "allow"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
