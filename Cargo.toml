[workspace]
resolver = "3"
members = [
    "crates/bkp-core",
    "crates/bkp-cli",
    "crates/bkp-passkey",
    "crates/bkp-protocol",
    "crates/bkp-platform",
    "crates/bkp-proxy",
]
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "GPL-3.0-or-later"
repository = "https://github.com/betterkeepass/BetterKeePass"
authors = ["BetterKeePass Contributors"]

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
getrandom = { version = "0.4", features = ["std"] }
keepass = { version = "0.17", features = ["save_kdbx4", "totp"] }
rpassword = "7"
secrecy = "0.10.3"
thiserror = "2"
uuid = { version = "1.18", features = ["v4"] }
zeroize = { version = "1", features = ["zeroize_derive"] }

bkp-core = { path = "crates/bkp-core", version = "0.1.0" }
bkp-passkey = { path = "crates/bkp-passkey", version = "0.1.0" }
bkp-platform = { path = "crates/bkp-platform", version = "0.1.0" }
bkp-protocol = { path = "crates/bkp-protocol", version = "0.1.0" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
doc_markdown = "allow"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
